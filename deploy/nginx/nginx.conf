server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/sentrax.crt;
    ssl_certificate_key /etc/nginx/certs/sentrax.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS; re-resolves "backend" if its container restarts
    resolver 127.0.0.11 valid=10s;

    # API and the Wazuh webhook (/api/webhooks/wazuh) go to the backend
    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
