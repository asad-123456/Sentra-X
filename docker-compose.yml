services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sentrax
      POSTGRES_USER: sentrax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentrax}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentrax -d sentrax"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata: